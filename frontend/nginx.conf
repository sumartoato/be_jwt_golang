server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Compress API responses (the drug list is several MB of JSON) and static assets.
    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css image/svg+xml;

    # API requests go to the Go backend (same origin for the browser, no CORS needed).
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Built assets have a content hash in their name, so they never change: cache them for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback for client-side routes. index.html names the current assets,
    # so the browser must check it on every load; otherwise it keeps an old version after a deploy.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
