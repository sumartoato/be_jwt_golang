openapi: 3.0.3
info:
  title: JWT Auth API
  version: 1.0.0
  description: |
    Register, log in and access protected endpoints with a JWT (HS256).

    To call a protected endpoint: run **POST /api/auth/login**, copy `token`
    from the response, click **Authorize** and paste it (without the `Bearer ` prefix).
servers:
  - url: /
    description: Same origin as this page

tags:
  - name: auth
    description: Registration, login and token refresh
  - name: user
    description: Endpoints that require a valid token
  - name: admin
    description: |
      Role management. Access follows the menu: a caller whose role can open
      Management > Role (`/management/role`) can use the role endpoints, and
      Management > User (`/management/user`) the user endpoints. Others get 403.
  - name: master-data
    description: |
      Master data pages. Access follows the page's menu item; stock and prices
      per branch are limited to the branches the caller is mapped to.
  - name: system
    description: Operational endpoints

paths:
  /api/auth/register:
    post:
      tags: [auth]
      summary: Register a new user
      description: |
        The email is trimmed and stored lowercase. The password must be 8–72
        characters and `confirmPassword` must match it.
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Email is already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              example:
                error: email already registered
                errors:
                  email: Email is already registered
        '500':
          $ref: '#/components/responses/InternalError'

  /api/auth/login:
    post:
      tags: [auth]
      summary: Log in and get a token
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Wrong email or password (same message for both, on purpose)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: invalid email or password
        '500':
          $ref: '#/components/responses/InternalError'

  /api/auth/refresh:
    post:
      tags: [auth]
      summary: Exchange a still-valid token for a new one
      description: Sliding expiration. An expired token cannot be refreshed; log in again.
      operationId: refresh
      security:
        - bearerAuth: []
      responses:
        '200':
          description: New token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/me:
    get:
      tags: [user]
      summary: Current user
      description: Returns the identity stored in the token.
      operationId: me
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/menus:
    get:
      tags: [user]
      summary: Sidebar menu
      description: |
        Active rows of the `menus` table as a tree, ordered by `sort_order`,
        limited to what the caller's role grants (see `roles` / `role_menus`).
        An item is hidden when it or any of its ancestors has `is_active = false`.
        A user without a role gets an empty list.
      operationId: listMenus
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Menu tree
          content:
            application/json:
              schema:
                type: object
                properties:
                  menus:
                    type: array
                    items:
                      $ref: '#/components/schemas/MenuItem'
                  role:
                    type: string
                    nullable: true
                    description: Name of the caller's role; null if they have none
                    example: Perawat
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/roles:
    get:
      tags: [admin]
      summary: List roles
      description: Every role, plus the full active menu tree to pick menus from.
      operationId: listRoles
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Roles and menu tree
          content:
            application/json:
              schema:
                type: object
                properties:
                  roles:
                    type: array
                    items:
                      $ref: '#/components/schemas/Role'
                  menus:
                    type: array
                    items:
                      $ref: '#/components/schemas/MenuItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [admin]
      summary: Create a role
      operationId: createRole
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: A role with this name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /api/roles/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    put:
      tags: [admin]
      summary: Update a role
      description: |
        Replaces the name, `allAccess` and the granted menus. Editing your own
        role so that it no longer reaches Management > Role is refused with 400.
      operationId: updateRole
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleInput'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: A role with this name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
    delete:
      tags: [admin]
      summary: Delete a role
      operationId: deleteRole
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The role is still assigned to users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/users:
    get:
      tags: [admin]
      summary: List users with their role
      operationId: listUsers
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Users, and the roles and branches they can be given
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserRole'
                  roles:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                  branches:
                    type: array
                    items:
                      type: object
                      properties:
                        kode:
                          type: string
                          example: MED
                        nama:
                          type: string
                          example: KLINIK MEDIKA
                        isActive:
                          type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/users/{id}/menus:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [admin]
      summary: Menus a user gets from their role
      description: |
        The menu tree this user sees in their sidebar, computed the same way as
        GET /api/menus. A user without a role gets an empty list and role null.
      operationId: userMenus
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Menu tree
          content:
            application/json:
              schema:
                type: object
                properties:
                  role:
                    type: string
                    nullable: true
                    example: Perawat
                  allAccess:
                    type: boolean
                  menus:
                    type: array
                    items:
                      $ref: '#/components/schemas/MenuItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/users/{id}/branches:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags: [admin]
      summary: Set the branches a user belongs to
      description: |
        Replaces the user's rows in `refbranchauth`. A user can belong to several
        branches; an empty list removes them all. Codes are trimmed, uppercased
        and de-duplicated. Changing your own branches is allowed.
      operationId: setUserBranches
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [branches]
              properties:
                branches:
                  type: array
                  items:
                    type: string
                    maxLength: 10
                  example: [MED, PRM]
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  branches:
                    type: array
                    items:
                      type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/users/{id}/role:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags: [admin]
      summary: Change a user's role
      description: You cannot change your own role (400).
      operationId: setUserRole
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roleId]
              properties:
                roleId:
                  type: integer
                  nullable: true
                  description: null removes the role (the user then sees no menus)
                  example: 3
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  roleId:
                    type: integer
                    nullable: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/branches:
    get:
      tags: [admin]
      summary: List branches
      description: |
        Clinic branches ordered by name. Requires the Management > Cabang menu
        (`/management/cabang`). The secret key is never returned, only whether
        it is set and its last 4 characters.
      operationId: listBranches
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Branches
          content:
            application/json:
              schema:
                type: object
                properties:
                  branches:
                    type: array
                    items:
                      $ref: '#/components/schemas/Branch'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [admin]
      summary: Create a branch
      operationId: createBranch
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BranchInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: The branch code is already used
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /api/branches/{kode}:
    parameters:
      - name: kode
        in: path
        required: true
        description: Branch code (primary key of refbranch)
        schema:
          type: string
          example: CTM
    put:
      tags: [admin]
      summary: Update a branch
      description: |
        The kode cannot change: a `kode` in the body is ignored.
        An empty or missing `secretKey` keeps the stored key.
      operationId: updateBranch
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BranchInput'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The branch code is already used
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /api/obat:
    get:
      tags: [master-data]
      summary: List drugs with stock at your branches
      description: |
        Every drug in refobat. `stocks` holds trxstock rows only for the branches
        the caller is mapped to (refbranchauth), which are also returned in
        `branches`. Requires the Master Data Klinik > Obat menu.
      operationId: listObat
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Drugs and the caller's branches
          content:
            application/json:
              schema:
                type: object
                properties:
                  obat:
                    type: array
                    items:
                      $ref: '#/components/schemas/Obat'
                  branches:
                    type: array
                    items:
                      type: object
                      properties:
                        kode:
                          type: string
                          example: MED
                        nama:
                          type: string
                          example: KLINIK MEDIKA
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [master-data]
      summary: Create a drug
      operationId: createObat
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObatInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Obat'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/obat/options:
    get:
      tags: [master-data]
      summary: Lookup lists for the drug form
      operationId: obatOptions
      security:
        - bearerAuth: []
      responses:
        '200':
          description: One list of {id, name} per lookup table
          content:
            application/json:
              schema:
                type: object
                properties:
                  jenis: { $ref: '#/components/schemas/OptionList' }
                  satuan: { $ref: '#/components/schemas/OptionList' }
                  logo: { $ref: '#/components/schemas/OptionList' }
                  produsen: { $ref: '#/components/schemas/OptionList' }
                  moving: { $ref: '#/components/schemas/OptionList' }
                  movingPo: { $ref: '#/components/schemas/OptionList' }
                  distributor: { $ref: '#/components/schemas/OptionList' }
                  principal: { $ref: '#/components/schemas/OptionList' }
                  golongan: { $ref: '#/components/schemas/OptionList' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/obat/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    put:
      tags: [master-data]
      summary: Update a drug
      operationId: updateObat
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObatInput'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Obat'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/obat/{id}/stock/{cabang}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      - name: cabang
        in: path
        required: true
        description: Branch code; must be one of the caller's branches
        schema:
          type: string
          example: MED
    put:
      tags: [master-data]
      summary: Set a drug's stock and prices at one branch
      description: Creates or updates the trxstock row. 403 when the caller is not mapped to the branch.
      operationId: setObatStock
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObatStockInput'
      responses:
        '200':
          description: The drug with its updated stock
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Obat'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /healthz:
    get:
      tags: [system]
      summary: Health check
      operationId: healthz
      responses:
        '200':
          description: Server is up
          content:
            text/plain:
              schema:
                type: string
                example: ok

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: Invalid JSON body, or one or more fields failed validation
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/ValidationError'
              - $ref: '#/components/schemas/Error'
          examples:
            validation:
              summary: Field validation failed
              value:
                error: validation failed
                errors:
                  password: Password must be at least 8 characters
                  confirmPassword: Passwords do not match
            invalidJson:
              summary: Body is not valid JSON
              value:
                error: invalid JSON body
    Unauthorized:
      description: Missing, invalid or expired bearer token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            missing:
              value:
                error: missing bearer token
            invalid:
              value:
                error: invalid or expired token
    Forbidden:
      description: The caller's role cannot open the menu item this endpoint belongs to
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: your role cannot access this page
    NotFound:
      description: No such resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: not found
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: internal server error

  schemas:
    RegisterRequest:
      type: object
      required: [email, password, confirmPassword]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          example: alice@example.com
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          example: password123
        confirmPassword:
          type: string
          format: password
          example: password123

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: alice@example.com
        password:
          type: string
          format: password
          example: password123

    RegisterResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
          example: alice@example.com

    TokenResponse:
      type: object
      properties:
        token:
          type: string
          description: HS256 JWT with claims sub (user id), email, iat, exp
        expiresAt:
          type: string
          format: date-time

    MeResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
          example: alice@example.com
        message:
          type: string
          example: Hello alice@example.com, welcome back

    MenuItem:
      type: object
      properties:
        id:
          type: integer
          example: 2
        title:
          type: string
          example: Master Data
        icon:
          type: string
          description: Icon name the frontend maps to an icon
          example: database
        path:
          type: string
          nullable: true
          description: Frontend route; null for a group without its own page
          example: null
        children:
          type: array
          items:
            $ref: '#/components/schemas/MenuItem'

    Role:
      type: object
      properties:
        id:
          type: integer
          example: 3
        name:
          type: string
          example: Perawat
        allAccess:
          type: boolean
          description: Every active menu, including menus added later
        menuIds:
          type: array
          description: Granted menu ids. A group id grants everything under it
          items:
            type: integer
          example: [1, 21, 30]
        userCount:
          type: integer
          example: 1

    RoleInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
          example: Kasir
        allAccess:
          type: boolean
          default: false
        menuIds:
          type: array
          items:
            type: integer
          example: [1, 21]

    UserRole:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
          example: perawat@medika.com
        roleId:
          type: integer
          nullable: true
          example: 3
        branches:
          type: array
          description: Branch codes from refbranchauth, sorted
          items:
            type: string
          example: [MED, PRM]

    Branch:
      type: object
      description: A row of the refbranch table. Empty strings stand for NULL.
      properties:
        id:
          type: integer
          example: 1
        kode:
          type: string
          example: CTM
        nama:
          type: string
          example: KLINIK CITRA MEDIKA
        alamat:
          type: string
        telp:
          type: string
        kodeKwt:
          type: string
          description: kode_kwt (may differ from kode)
          example: CTM
        npwp:
          type: string
        namaNpwp:
          type: string
        dbHbee:
          type: string
          example: t79144_medika
        kodeFasyankes:
          type: string
          example: '31710300339'
        namaFasyankes:
          type: string
          example: KLINIK PRATAMA CITRA MEDIKA
        clientKey:
          type: string
        secretKeySet:
          type: boolean
        secretKeyHint:
          type: string
          description: Last 4 characters of the secret key (empty when unset or short)
          example: ZAs1
        organizationId:
          type: string
          example: '100468100'
        isActive:
          type: boolean
          description: isactive = 1
        isInternal:
          type: boolean
          description: isinternal = 1 (own clinic) or 0 (partner)

    BranchInput:
      type: object
      required: [kode, nama]
      description: Lengths follow the varchar sizes of refbranch. Empty values are stored as NULL.
      properties:
        kode:
          type: string
          maxLength: 20
          pattern: '^[A-Za-z0-9_-]+$'
          description: Create only; stored uppercase; must be unique
          example: CTM
        nama:
          type: string
          maxLength: 50
          example: KLINIK CITRA MEDIKA
        alamat:
          type: string
          maxLength: 200
        telp:
          type: string
          maxLength: 200
        kodeKwt:
          type: string
          maxLength: 10
        npwp:
          type: string
          maxLength: 50
        namaNpwp:
          type: string
          maxLength: 100
        dbHbee:
          type: string
          maxLength: 50
        kodeFasyankes:
          type: string
          maxLength: 50
        namaFasyankes:
          type: string
          maxLength: 100
        clientKey:
          type: string
          maxLength: 100
        secretKey:
          type: string
          format: password
          maxLength: 100
          description: On update, leave empty to keep the stored key
        organizationId:
          type: string
          maxLength: 100
        isActive:
          type: boolean
          default: false
        isInternal:
          type: boolean
          default: false

    OptionList:
      type: array
      items:
        type: object
        properties:
          id:
            type: integer
          name:
            type: string

    ObatStock:
      type: object
      description: A trxstock row
      properties:
        cabang: { type: string, example: MED }
        stok: { type: number, nullable: true, example: 505 }
        stokMin: { type: number, nullable: true }
        hbeli: { type: number, nullable: true }
        hp: { type: number, nullable: true }
        hjual: { type: number, nullable: true, example: 175000 }
        isActive: { type: boolean }

    ObatStockInput:
      type: object
      properties:
        stok: { type: number, minimum: 0, nullable: true }
        stokMin: { type: number, minimum: 0, nullable: true }
        hbeli: { type: number, minimum: 0, nullable: true }
        hp: { type: number, minimum: 0, nullable: true }
        hjual: { type: number, minimum: 0, nullable: true }
        isActive: { type: boolean }

    ObatInput:
      type: object
      required: [nama]
      description: Editable refobat columns. Lookup ids must exist (see /api/obat/options).
      properties:
        nama: { type: string, maxLength: 100, example: PARACETAMOL 500 MG }
        isi: { type: string, maxLength: 10 }
        isiPerBox: { type: string, maxLength: 20 }
        idJenis: { type: integer, nullable: true }
        idLogo: { type: integer, nullable: true }
        idProd: { type: integer, nullable: true }
        satBeli: { type: integer, nullable: true }
        satJual: { type: integer, nullable: true }
        idMoving: { type: integer, nullable: true }
        idMovingPo: { type: integer, nullable: true }
        idDistributor: { type: integer, nullable: true }
        idPrincipal: { type: integer, nullable: true }
        idGolongan: { type: integer, nullable: true }
        qjb: { type: number, minimum: 0, nullable: true }
        hbeli: { type: number, minimum: 0, nullable: true }
        hjual: { type: number, minimum: 0, nullable: true }
        hp: { type: number, minimum: 0, nullable: true }
        nonAktif: { type: boolean }
        kenaPajak: { type: boolean }
        komposisi: { type: string, maxLength: 5000 }

    Obat:
      allOf:
        - $ref: '#/components/schemas/ObatInput'
        - type: object
          properties:
            id: { type: integer, example: 1 }
            updatedBy: { type: string }
            updatedAt: { type: string, format: date-time, nullable: true }
            stocks:
              type: array
              items:
                $ref: '#/components/schemas/ObatStock'

    Error:
      type: object
      properties:
        error:
          type: string

    ValidationError:
      type: object
      properties:
        error:
          type: string
          example: validation failed
        errors:
          type: object
          description: Field name to message
          additionalProperties:
            type: string
